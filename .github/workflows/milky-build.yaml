name: Build CharonAnchor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download QQ deb and extract dependencies
        run: |
          # Download QQ deb
          wget -q https://dldir1v6.qq.com/qqfile/qq/QQNT/f9cbaab2/linuxqq_3.2.28-48517_amd64.deb -O /tmp/qq.deb

          # Extract deb
          mkdir -p /tmp/qq-extract
          dpkg-deb -x /tmp/qq.deb /tmp/qq-extract

          # Copy dependencies to project
          cp /tmp/qq-extract/opt/QQ/resources/app/wrapper.node ./wrapper.node
          cp /tmp/qq-extract/opt/QQ/lib/libbugly.so ./libbugly.so
          cp /tmp/qq-extract/opt/QQ/lib/libcrbase.so ./libcrbase.so

          echo "Extracted files:"
          ls -la wrapper.node libbugly.so libcrbase.so libsymbols.so

      - name: Publish
        run: dotnet publish Lagrange.Milky -c Release -r linux-x64 -p:DebugType=none -p:StripSymbols=true -p:OptimizationPreference=Size

      - name: Package with dependencies
        run: |
          cd Lagrange.Milky/bin/Release/net10.0/linux-x64/publish

          # Copy all dependencies to publish directory
          cp ../../../../wrapper.node .
          cp ../../../../libbugly.so .
          cp ../../../../libcrbase.so .
          cp ../../../../libsymbols.so .

          echo "Package contents:"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: CharonAnchor-linux-x64
          path: Lagrange.Milky/bin/Release/net10.0/linux-x64/publish/

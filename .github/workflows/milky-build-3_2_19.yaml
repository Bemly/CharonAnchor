name: Build CharonAnchor 3.2.19

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build-3_2_19:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10'

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download deb and extract dependencies
        run: |
          wget -q https://dldir1v6.qq.com/qqfile/qq/QQNT/c773cdf7/linuxqq_3.2.19-39038_amd64.deb -O /tmp/linuxim.deb

          mkdir -p /tmp/linuxim-extract
          dpkg-deb -x /tmp/linuxim.deb /tmp/linuxim-extract

          cp /tmp/linuxim-extract/opt/QQ/resources/app/wrapper.node ./wrapper.node
          cp /tmp/linuxim-extract/opt/QQ/resources/app/libbugly.so ./libbugly.so
          cp /tmp/linuxim-extract/opt/QQ/resources/app/libcrbase.so ./libcrbase.so

          # Compile libsymbols.so on Linux (repo version is macOS Mach-O)
          gcc -shared -fPIC -o libsymbols.so -xc - <<< 'void qq_magic_napi_register(void* arg) {}'

          echo "Extracted files:"
          ls -la wrapper.node libbugly.so libcrbase.so libsymbols.so

      - name: Set random DeviceName
        run: |
          DEVICE="CT-$(openssl rand -hex 6 | tr '[:lower:]' '[:upper:]')"
          echo "DeviceName: $DEVICE"
          sed -i "s|// \"DeviceName\": \"[^\"]*\"|\"DeviceName\": \"$DEVICE\"|" Lagrange.Milky/Resources/appsettings.jsonc
          grep DeviceName Lagrange.Milky/Resources/appsettings.jsonc

      - name: Publish
        run: dotnet publish Lagrange.Milky -c Release -r linux-x64 -p:DebugType=none -p:StripSymbols=true -p:OptimizationPreference=Size

      - name: Package with dependencies
        run: |
          cd Lagrange.Milky/bin/Release/net10.0/linux-x64/publish

          cp ${{ github.workspace }}/wrapper.node .
          cp ${{ github.workspace }}/libbugly.so .
          cp ${{ github.workspace }}/libcrbase.so .
          cp ${{ github.workspace }}/libsymbols.so .

          echo "Package contents:"
          ls -la

      - name: Build Docker image (local)
        id: build
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/charonanchor:3.2.19"

          cd Lagrange.Milky/bin/Release/net10.0/linux-x64/publish

          cat > Dockerfile <<'EOF'
          FROM ubuntu:latest
          RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates libgnutls30 libssl3t64 \
              libvips42 libx11-6 libx11-xcb1 libxext6 \
              libunwind8 libgssapi-krb5-2 libssh2-1t64 libpsl5t64 \
              && rm -rf /var/lib/apt/lists/*
          WORKDIR /root
          COPY . /usr/local/bin/
          CMD ["Lagrange.Milky"]
          EOF

          docker build -t "$IMAGE" .
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Verify Docker image
        run: |
          IMAGE="${{ steps.build.outputs.image }}"

          echo "Starting container from $IMAGE ..."
          docker run -d --name charon-verify "$IMAGE" 2>&1

          # Wait for QR login output (timeout 30s)
          QR_FOUND=false
          for i in $(seq 1 30); do
            sleep 1
            LOGS=$(docker logs charon-verify 2>&1 || true)
            if echo "$LOGS" | grep -qiE "qr|qrcode|qlogo|scan.*qr|二维码|login.*url|http.*qq.*qr"; then
              echo "✓ QR login output detected at ${i}s"
              QR_FOUND=true
              break
            fi
          done

          if [ "$QR_FOUND" = false ]; then
            echo "::warning::QR code not detected in 30s, dumping logs:"
            docker logs charon-verify 2>&1 || true
          fi

          docker stop charon-verify 2>/dev/null || true
          docker rm charon-verify 2>/dev/null || true

          if [ "$QR_FOUND" = false ]; then
            echo "::error::Verification failed: no QR login output"
            exit 1
          fi

          echo "✓ Image verification passed"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          IMAGE="${{ steps.build.outputs.image }}"
          echo "Pushing $IMAGE ..."
          docker push "$IMAGE"
          echo "✓ Published $IMAGE"

      - name: Cleanup old untagged versions
        run: |
          echo "Listing old untagged versions..."
          VERSIONS=$(gh api "users/${{ github.repository_owner }}/packages/container/charonanchor/versions" \
            --jq '.[] | select(.metadata.container.tags | length == 0) | .id' 2>/dev/null || echo "")

          if [ -z "$VERSIONS" ]; then
            echo "No untagged versions to clean up"
            exit 0
          fi

          deleted=0
          for vid in $VERSIONS; do
            echo "Deleting untagged version $vid..."
            gh api "users/${{ github.repository_owner }}/packages/container/charonanchor/versions/$vid" \
              -X DELETE --silent && deleted=$((deleted + 1))
          done

          echo "✓ Cleaned up $deleted old untagged version(s) (tagged 3.2.19 / 3.2.28 untouched)"
